config-version: 1

core:
  debug: false

roleplay:
  text-duration-ticks: 200
  ooc-radius: 30
  max-text-length: 256
  carry-distance: 2

totem:
  limit: 3
  cooldown-hours: 15
  block-vanilla-resurrection: true

items:
  sneak-to-pickup: true

integrations:
  essentials:
    block-economy-commands: true

